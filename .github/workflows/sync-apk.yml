name: Sync Nova Launcher APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest APK
        run: |
          set -e
          mkdir -p apk
          curl -fL --retry 3 --retry-delay 5 \
            -o apk/NovaLauncher-arm64-debug.apk \
            https://github.com/k91541963-blip/ZalithLauncher2/releases/download/apk-latest/NovaLauncher-arm64-debug.apk

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          if git diff --cached --quiet; then
            echo "APK is already up to date"
          else
            git commit -m "apk: update Nova Launcher (arm64 debug)"
            git push
          fi
