name: Build Nova Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'apk/**'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout launcher source
        uses: actions/checkout@v4
        with:
          repository: k91541963-blip/ZalithLauncher2
          ref: nova/phase2-branding
          path: src

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('src/PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build debug APK (arm64)
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64

      - name: Commit APK
        run: |
          mkdir -p apk
          cp src/ZalithLauncher/build/outputs/apk/debug/*.apk apk/NovaLauncher-arm64-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          if git diff --cached --quiet; then
            echo "APK is already up to date"
          else
            git commit -m "apk: Nova Launcher arm64 debug ($(git -C src rev-parse --short HEAD))"
            git push
          fi
